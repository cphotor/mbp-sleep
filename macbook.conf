# macbook.conf -- the only configuration file for this machine's sleep handling.
#
# Installed to /etc/mbp-sleep.conf by install.sh.  Every switch below is an
# individual on/off control; every one of them defaults to `on`, which is the
# operator's instruction (2026-10-20): every behaviour is a switch, and every
# switch is on unless it is deliberately turned off.
#
# Format: `key = value`, `#` starts a comment, blank lines are ignored.
# Anything missing here falls back to the same defaults compiled into
# `mbp-sleep`, so a truncated file is not a broken file.

# ---------------------------------------------------------------------------
# 1. ACPI wake sources at boot
# ---------------------------------------------------------------------------
# /proc/acpi/wakeup is rebuilt from the firmware at every boot and SPIT comes
# back disabled, which would reduce this machine to power-button-only wake.
# AGENTS.md rule 3 forbids that.
wake_sources        = on
wake_devices        = SPIT XHC1 LID0

# ---------------------------------------------------------------------------
# 2. Wi-Fi: detach before sleep, restore after
# ---------------------------------------------------------------------------
# The order matters and it is what the old experiment got wrong: disconnect
# first so wpa_supplicant releases the interface, then unload.  Unloading a
# driver that wpa_supplicant still holds leaves the process in state D and the
# suspend never happens ("The brcmfmac trap").
#
# Detaching also removes the suspend-time refusal seen on 2026-10-20: a loaded
# brcmfmac could refuse to be suspended, and one refusing device aborts the
# whole transaction with -EIO.  A driver that is not loaded cannot refuse.
wifi_detach         = on
wifi_interface      = wlan0
wifi_modules        = brcmfmac_wcc brcmfmac   # unloaded left to right: wcc first,
                                              # or brcmfmac reports "in use"
wifi_restore_wait   = 20          # seconds to wait for the interface to come back

# ---------------------------------------------------------------------------
# 3. Thunderbolt Ethernet adapter
# ---------------------------------------------------------------------------
# It is the clearest single lead the investigation produced
# (docs/background.md): a wedge is much more likely with it attached.
# Deauthorising the endpoint takes it off the PCI bus before the machine sleeps;
# the host controller 0-0 is never touched.
#
# This is the behaviour of config-changes.md C5, which was tried on 2026-10-19,
# worked, and was reverted at the operator's instruction because an instant wake
# happened once an hour later (n=1, never attributed).
thunderbolt_eject   = on
thunderbolt_name    = Thunderbolt to Gigabit Ethernet Adapter
thunderbolt_settle  = 2           # seconds before re-authorising on resume

# ---------------------------------------------------------------------------
# 4. CIFS network shares
# ---------------------------------------------------------------------------
# A dirty page on a dead link makes sync_filesystem() wait out the CIFS
# reconnect deadline.  Unmounting while the share is idle avoids it entirely.
#
# `cifs_auto` is what makes this general: the shares are *discovered* from
# /proc/mounts by filesystem type, not named here.  Any machine with SMB or NFS
# mounted gets the same treatment without editing this file, and a machine with
# none simply has nothing to do.  `cifs_shares` is only read when `cifs_auto` is
# off, and then only `cifs_root` + name is used.
#
# An idle `x-systemd.automount` share is left alone either way: its mount point
# carries `autofs`, not `cifs`, so it is neither unmounted nor remounted.
cifs_unmount        = on
cifs_auto           = on
network_fstypes     = cifs smb3 nfs nfs4 fuse.sshfs
cifs_shares         =                            # only used if cifs_auto = off;
                                                 # empty on purpose: discovery
                                                 # needs no share names
cifs_root           = /mnt
cifs_umount_wait    = 15          # seconds per share before giving up
cifs_reconnect_wait = 120         # seconds to keep retrying after a resume;
                                  # the network is not up when the hook runs

# ---------------------------------------------------------------------------
# 5. Do not suspend while a backup is running
# ---------------------------------------------------------------------------
# The machine holds a logind block lock for the duration of a backup, so a
# suspend request is refused instead of interrupting it.  The request is
# remembered and re-issued when the backup ends.
#
# backup_names is the list of program names that count as "a backup is running".
# It is matched against a process's own argv, not against a regex over its
# command line: a shell command that merely mentions borg (a grep, a diagnostic
# one-liner) used to match the regex form and made the machine believe a backup
# was running.  `borg` as argv[0], or as argv[1] behind the python interpreter a
# shebang produces, is what is actually backed up by.
defer_on_backup     = on
backup_names        = borg
defer_max_wait      = 3600        # seconds; a backup that runs longer than this
                                  # stops holding the lock (safety valve)

# With the lock held, a suspend request from the desktop makes polkit offer the
# password that would *force* the suspend past the lock.  `on` writes
# /etc/polkit-1/rules.d/49-mbp-sleep-no-force-suspend.rules, which denies that
# one action, so the request is refused quietly and the machine suspends by
# itself when the backup ends.  `off` restores the prompt.
#
# The file is generated from this switch and carries a marker saying so; a file
# without that marker is never overwritten or deleted.  Turn the switch off and
# restart the service to remove it.  To force a suspend regardless, stop the
# service first: `systemctl stop mbp-sleep`.
silence_force_prompt = on

# ---------------------------------------------------------------------------
# 6. Lid
# ---------------------------------------------------------------------------
# logind is told to ignore the lid switch (install.sh writes the drop-in), and
# this program takes over: close the lid and it suspends, unless a backup is
# running, in which case it waits and suspends when the backup ends.
lid_watch           = on
lid_state           = /proc/acpi/button/lid/LID0/state

# ---------------------------------------------------------------------------
# 7. A self-wake must not leave the machine awake
# ---------------------------------------------------------------------------
# This machine has a wake source that is not identified: it resumes with the lid
# closed and nobody near it (measured 2026-10-23: 11 s, 59 s and 21646 s after
# closing the lid; docs/background.md).  The wake itself cannot be suppressed --
# masking the EC's GPE 0x4E did not stop it, and the only sources Linux can turn
# off are the keyboard/lid sources rule 3 says must keep working.
#
# What is suppressed is the consequence.  logind's lid handling is off (section
# 6) and the lid watch above only fires on a *fresh close*, so a wake that finds
# the lid still closed used to leave the machine awake for as long as the lid
# stayed shut -- 38 hours on 2026-10-23.  `on` sends it back to sleep after
# `resuspend_delay` seconds, at most `resuspend_max` times in a row, so a
# wake/suspend loop cannot thrash the disk forever.  A sleep longer than five
# minutes starts the count again; opening the lid clears it.
#
# A deliberate test that resumes with the lid closed (rtcwake, test-suspend.sh)
# is re-suspended too: open the lid first, or set `resuspend = off`.
resuspend           = on
resuspend_delay     = 10          # seconds to settle before going back to sleep
resuspend_max       = 3           # consecutive re-suspends before giving up

# `pre` saves /sys/class/wakeup/*/event_count and the ACPI GPE counters, and
# `post` logs what changed, so the next unexplained wake has a candidate.  Use
# `event_count`, never `wakeup_count`: the latter only moves on a retried
# suspend and stays 0 on a clean S3 cycle.  A mover is a candidate, not a cause:
# the Apple EC block moves its counters on every cycle regardless.
wake_log            = on

# ---------------------------------------------------------------------------
# 8. systemd's user-session freeze
# ---------------------------------------------------------------------------
# `off` installs the drop-in that sets
# SYSTEMD_SLEEP_FREEZE_USER_SESSIONS=false.  This is the operator's long-term
# setting (config-changes.md C1, AGENTS.md rule 5.1) and is kept regardless of
# whether it helps.
freeze_sessions     = off
